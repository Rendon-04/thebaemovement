<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>The Bae Movement</title>
    <meta
      name="description"
      content="BAE Movement hosts wellness, fitness, and community-driven events for creatives and professionals."
    />
    <meta
      name="keywords"
      content="BAE Movement, wellness events, fitness community, group workouts, community wellness"
    />
    <meta name="author" content="BAE Movement" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/baeicon.png" />

    <!-- Open Graph (Facebook, LinkedIn, iMessage, etc.) -->
    <meta property="og:title" content="BAE Movement – Wellness Events & Community" />
    <meta
      property="og:description"
      content="Wellness and community events for modern creatives."
    />
    <meta property="og:url" content="https://thebaemovement.com" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://thebaemovement.com/baeicon.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BAE Movement – Wellness Events & Community" />
    <meta
      name="twitter:description"
      content="Wellness and community events for modern creatives."
    />
    <meta name="twitter:image" content="https://thebaemovement.com/baeicon.png" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link rel="canonical" href="https://thebaemovement.com" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
